apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: whoami
  namespace: rollout-canary
spec:
  replicas: 4

  selector:
    matchLabels:
      app: whoami

  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.3
          ports:
            - containerPort: 80

  strategy:
    canary:
      stableService: whoami
      canaryService: whoami-canary

      steps:
        - setWeight: 25
        - pause:
            duration: 30s

        - setWeight: 50
        - pause:
            duration: 30s

        - setWeight: 100
