apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: whoami
  namespace: rollout-learning
spec:
  replicas: 2

  selector:
    matchLabels:
      app: whoami

  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.11.0
          ports:
            - containerPort: 80

strategy:
  blueGreen:
    activeService: whoami
    previewService: whoami-preview
